<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff7e8">
  <meta name="description" content="パパが作ってくれたごはんを写真で残す、家族向けの小さなアルバムです。">
  <title>パパごはんアルバム</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <p class="eyebrow">家族のごはんメモ</p>
      <h1>パパごはんアルバム</h1>
      <div class="top-actions">
        <button class="primary-action" id="openFormButton" type="button">今日のごはんを記録</button>
        <button class="secondary-action" id="pickMealButton" type="button">今日なに食べたい？</button>
      </div>
    </header>

    <main>
      <section class="tab-panel is-active" id="recordPanel" aria-labelledby="recordTab">
        <label class="search-box">
          <span>料理名・材料で検索</span>
          <input id="searchInput" type="search" inputmode="search" placeholder="例：鶏肉、カレー、玉ねぎ">
        </label>
        <div class="meal-list" id="mealList" aria-live="polite"></div>
        <section class="backup-section" aria-labelledby="backupTitle">
          <h2 id="backupTitle" class="backup-title">データのバックアップ</h2>
          <p class="backup-desc">料理の記録と写真を、1つのファイルに保存・復元できます。外部には送りません。</p>
          <div class="backup-actions">
            <button class="backup-button" id="backupExportButton" type="button">バックアップを書き出す</button>
            <button class="backup-button" id="backupImportButton" type="button">バックアップから復元</button>
          </div>
          <input id="backupFileInput" type="file" accept="application/json,.json">
          <p id="backupMessage" class="backup-message" hidden role="status"></p>
        </section>
      </section>

      <section class="tab-panel" id="randomPanel" aria-labelledby="randomTab">
        <div class="random-area" id="randomArea" aria-live="polite">
          <p class="soft-message">「今日なに食べたい？」を押すと、今までのごはんから1品えらびます。</p>
        </div>
      </section>
    </main>
  </div>

  <nav class="bottom-tabs" aria-label="画面切り替え">
    <button class="tab-button is-active" id="recordTab" type="button" aria-controls="recordPanel" aria-selected="true">ごはん記録</button>
    <button class="tab-button" id="randomTab" type="button" aria-controls="randomPanel" aria-selected="false">何食べたい？</button>
  </nav>

  <dialog class="meal-dialog" id="mealDialog">
    <form id="mealForm" method="dialog">
      <div class="dialog-header">
        <h2 id="dialogTitle">今日のごはん</h2>
        <button class="icon-button" id="closeDialogButton" type="button" aria-label="閉じる">×</button>
      </div>

      <input id="mealId" type="hidden">

      <div class="photo-picker">
        <span>料理の写真</span>
        <div class="photo-preview-frame">
          <img id="photoPreview" alt="選んだ料理写真のプレビュー">
          <strong id="photoHint">写真を選ぶとここに表示されます</strong>
        </div>
        <div class="photo-actions">
          <label class="photo-action">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M4 8.5A2.5 2.5 0 0 1 6.5 6H8l1.2-1.6A1 1 0 0 1 10 4h4a1 1 0 0 1 .8.4L16 6h1.5A2.5 2.5 0 0 1 20 8.5v8A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5v-8Z"/>
              <circle cx="12" cy="12.5" r="3.4"/>
            </svg>
            写真を撮る
            <input id="photoCameraInput" type="file" accept="image/*" capture="environment">
          </label>
          <label class="photo-action">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <rect x="4" y="5" width="16" height="14" rx="2.5"/>
              <path d="m7 16 3.6-4 2.8 3 1.8-2 2.8 3"/>
              <circle cx="9" cy="9" r="1.2"/>
            </svg>
            アルバムから選ぶ
            <input id="photoAlbumInput" type="file" accept="image/*">
          </label>
        </div>
      </div>

      <label class="field">
        <span>料理名 <b>必須</b></span>
        <input id="nameInput" type="text" maxlength="40" placeholder="例：ふわふわオムライス" required>
      </label>

      <label class="field">
        <span>主な材料</span>
        <textarea id="ingredientsInput" rows="3" maxlength="120" placeholder="例：ひき肉、玉ねぎ、卵"></textarea>
      </label>

      <label class="field">
        <span>日付</span>
        <input id="dateInput" type="date" required>
      </label>

      <button class="save-button" id="saveButton" type="submit">保存する</button>
    </form>
  </dialog>

  <dialog class="meal-dialog photo-dialog" id="photoDialog">
    <button class="icon-button photo-close" id="closePhotoButton" type="button" aria-label="閉じる">×</button>
    <img id="largePhoto" alt="料理写真">
  </dialog>

  <dialog class="meal-dialog detail-dialog" id="detailDialog">
    <div class="detail-header">
      <h2 id="detailName">料理の詳細</h2>
      <button class="icon-button" id="closeDetailButton" type="button" aria-label="閉じる">×</button>
    </div>
    <div class="detail-photo-frame" id="detailPhotoFrame">
      <img id="detailPhoto" alt="料理写真">
      <span id="detailPhotoPlaceholder">写真</span>
    </div>
    <div class="detail-body">
      <time id="detailDate" datetime=""></time>
      <p id="detailIngredients"></p>
      <button class="save-button" id="editFromDetailButton" type="button">編集する</button>
    </div>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
